name: Build AegisAC

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify JAR
        shell: bash
        run: |
          test -f target/AegisAC.jar
          echo "AegisAC.jar successfully built."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisAC
          path: target/AegisAC.jar
          if-no-files-found: error
          retention-days: 14
