prefix: "&8[&bAegisAC&8] "

command:
  help: |
    &8&m----------------------------------------
    &b&lAegisAC &7Commands
    &8&m----------------------------------------
    &b/aegisac help &8- &7Show this help
    &b/aegisac info &8- &7Plugin information
    &b/aegisac status &8- &7Show system status
    &b/aegisac checks &8- &7List registered checks
    &b/aegisac alerts &8- &7Check alert status
    &b/aegisac reload &8- &7Reload configuration
    &b/aegisac reset <player> &8- &7Reset player VL
    &b/aegisac reset <player> <check> &8- &7Reset check VL
    &b/aegisac version &8- &7Show plugin version
    &8&m----------------------------------------

  unknown: "&cUnknown command. &7Use &f/aegisac help&7."

  reload: "&aConfiguration and messages reloaded successfully."

  no-checks: "&eNo checks are currently registered."

  alerts-enabled: "&aAegisAC alerts are enabled for you."

  reset-usage: "&cUsage: &f/aegisac reset <player> [check]"

  reset-player: "&aReset all violations for &f{player}&a."

  reset-check: "&aReset &f{check} &aviolations for &f{player}&a."

  version: "&7Running &bAegisAC &7version &f{version}&7."

errors:
  no-permission: "&cYou do not have permission to use this command."

  player-not-found: "&cPlayer &f{player} &cwas not found."

  player-not-tracked: "&cPlayer &f{player} &cis not currently tracked."

alerts:
  violation: "&8[&bAegisAC&8] &c{player} &7failed &e{check} &8| &7VL: &f{vl} &8| &7Confidence: &f{confidence}% &8| &7Ping: &f{ping}ms"

  violation-setback: "&8[&bAegisAC&8] &c{player} &7failed &e{check} &8| &7VL: &f{vl} &8| &7Confidence: &f{confidence}% &8| &7Action: &eSetback"

  punishment: "&8[&bAegisAC&8] &c{player} &7has reached the punishment threshold for &e{check}&7."

  debug: "&8[&bAegisAC Debug&8] &7{player} &8» &f{check} &8| VL=&f{vl} &8| Confidence=&f{confidence}%"

setback:
  success: "&8[&bAegisAC&8] &7Invalid movement from &f{player} &7was corrected."

punishment:
  executed: "&8[&bAegisAC&8] &cPunishment executed for &f{player}&c."

  failed: "&8[&bAegisAC&8] &cFailed to execute punishment for &f{player}&c."

system:
  enabled: "&aAegisAC protection enabled."

  disabled: "&cAegisAC protection disabled."

  loaded: "&aAegisAC loaded successfully."

  unloaded: "&cAegisAC has been disabled."

  checks-loaded: "&7Loaded &f{count} &7checks."

  players-tracked: "&7Tracking &f{count} &7players."

logs:
  violation: "Violation detected: player={player}, check={check}, vl={vl}, confidence={confidence}%"

  punishment: "Punishment executed: player={player}, check={check}, vl={vl}"

  setback: "Setback executed: player={player}, check={check}"
