# ============================================================
# AegisAC
# Advanced Minecraft Anti-Cheat
# By KingBrezz
# ============================================================

settings:
  enabled: true

  debug: false

  performance-protection:
    enabled: true
    minimum-tps: 17.0

  ping-protection:
    enabled: true
    maximum-ping: 500

  spectator-ignore: true

  permission-bypass:
    enabled: true
    permission: "aegisac.bypass"

# ============================================================
# Detection
# ============================================================

detection:
  maximum-checks-per-cycle: 8

  minimum-confidence: 0.70

  violation:
    maximum: 100.0
    decay: 0.05

# ============================================================
# Setback
# ============================================================

setback:
  enabled: true

  interval-ms: 250

  maximum-per-interval: 3

# ============================================================
# Alerts
# ============================================================

alerts:
  enabled: true

  staff: true

  console: true

  anti-spam:
    enabled: true
    cooldown-ms: 1000

# ============================================================
# Punishment
# ============================================================

punishment:
  enabled: true

  threshold: 20

  require-confidence: true

  minimum-confidence: 0.95

  protect-operators: true

  command: "ban {player} Suspicious activity detected by AegisAC"

# ============================================================
# Checks
# ============================================================

checks:

  movement:
    enabled: true

    speed:
      enabled: true

      maximum-horizontal-speed: 0.70

      violation:
        amount: 1.0

    fly:
      enabled: true

      violation:
        amount: 1.0

    no-fall:
      enabled: true

      violation:
        amount: 1.0

  combat:
    enabled: true

    reach:
      enabled: true

      maximum-distance: 3.15

      violation:
        amount: 1.0

    aim:
      enabled: true

      violation:
        amount: 1.0

    autoclicker:
      enabled: true

      maximum-cps: 18

      violation:
        amount: 1.0

  player:
    enabled: true

    inventory:
      enabled: true

      violation:
        amount: 1.0

    interaction:
      enabled: true

      violation:
        amount: 1.0

# ============================================================
# World exclusions
# ============================================================

worlds:
  ignored: []

# ============================================================
# Logging
# ============================================================

logging:
  console:
    violations: true
    punishments: true
    setbacks: false
